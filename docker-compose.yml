version: '3'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.5.3
    ports:
      - "9200:9200"
    environment:
      - "discovery.type=single-node"
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    deploy:
      restart_policy:
        delay: 2s
        max_attempts: 3
        window: 120s
    networks:
      - elk
  kibana:
    image: docker.elastic.co/kibana/kibana:6.5.3
    ports:
      - "5601:5601"
    deploy:
      restart_policy:
        delay: 2s
        max_attempts: 3
        window: 120s
    networks:
      - elk
networks:
  elk:
volumes:
  elasticsearch:
