version: '3'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.2.2
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - cluster.name=elk
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /var/elasticdata:/usr/share/elasticsearch/data
    restart: "always"
    deploy:
      restart_policy:
        delay: 2s
        max_attempts: 3
        window: 120s
    networks:
      - elk
  elasticsearch2:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.2.2
    environment:
      - cluster.name=elk
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.zen.ping.unicast.hosts=elasticsearch"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /var/elasticdata2:/usr/share/elasticsearch/data
    restart: "always"
    networks:
      - elk
  kibana:
    image: docker.elastic.co/kibana/kibana:6.2.2
    ports:
      - "127.0.0.1:5601:5601"
    restart: "always"
    deploy:
      restart_policy:
        delay: 2s
        max_attempts: 3
        window: 120s
    networks:
      - elk
networks:
  elk:
